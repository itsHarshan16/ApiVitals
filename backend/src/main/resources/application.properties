# ============================================================
# APIVitals - Spring Boot Application Properties
# Developer A — Day 2
# ============================================================

# --- Server ---
server.port=8081
server.servlet.context-path=/api

# --- Application Info ---
spring.application.name=apivitals-backend

# --- DataSource (HikariCP) ---
spring.datasource.url=jdbc:mysql://localhost:3306/apivitals_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.pool-name=APIVitalsPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# --- JPA / Hibernate ---
# validate: Hibernate reads schema from DB; does NOT modify tables (Flyway owns schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# --- Flyway Database Migration ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET:apivitals_super_secret_key_change_in_production_32chars}
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- Monitoring ---
app.monitoring.check-interval-seconds=30
app.monitoring.request-timeout-seconds=5

# --- Logging ---
logging.level.root=WARN
logging.level.com.apimonitor=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

